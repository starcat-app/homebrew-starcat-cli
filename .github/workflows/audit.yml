name: Audit Formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit Formula when present
        run: |
          if [[ -f Formula/starcat.rb ]]; then
            brew style Formula/starcat.rb
            # Current Homebrew requires audit targets to be installed tap names,
            # not repository-relative Formula paths.
            brew tap starcat-app/starcat-cli \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
            brew audit --strict --formula starcat-app/starcat-cli/starcat
          else
            echo "Formula/starcat.rb will be generated by the first Starcat CLI release."
          fi
