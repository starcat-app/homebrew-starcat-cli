name: Audit Formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit Formula when present
        run: |
          if [[ -f Formula/starcat.rb ]]; then
            brew style Formula/starcat.rb
            brew audit --strict --formula Formula/starcat.rb
          else
            echo "Formula/starcat.rb will be generated by the first Starcat CLI release."
          fi
